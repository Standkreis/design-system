<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" />
    <meta
      name="description"
      content="Standkreis design system — shared foundations and accessible components for exploring nature together."
    />
    <title>Standkreis — Design system</title>
    <script>
      (() => {
        let theme = "system";
        try {
          const saved = localStorage.getItem("standkreis-theme");
          if (["light", "dark", "system"].includes(saved)) theme = saved;
        } catch {}
        const dark =
          theme === "dark" ||
          (theme === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
